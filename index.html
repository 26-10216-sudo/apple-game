<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>자운고등학교 마크 맞추기 게임 (합이 10)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FFF9F2;
      --primary-red: #FF5A5F;
      --apple-body: #FF4757;
      --apple-highlight: #FFA8A8;
      --apple-shadow: #D63031;
      --leaf-green: #2ED573;
      --stem-brown: #8D5B4C;
      --gold-yellow: #FFA502;
      --card-bg: #FFFFFF;
      --text-main: #4A4A4A;
      --text-muted: #888888;
      --accent-pink: #FF6B81;
      --board-border: #FFE3D8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Jua', 'Nunito', sans-serif;
      background: radial-gradient(circle at 50% 20%, #FFF5EB 0%, #FFE8E0 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Floating background deco bubbles */
    .bg-deco {
      position: fixed;
      border-radius: 50%;
      background: rgba(255, 90, 95, 0.06);
      pointer-events: none;
      z-index: 0;
      animation: floatSlow 8s ease-in-out infinite alternate;
    }
    .bg-deco-1 { width: 220px; height: 220px; top: -40px; left: -40px; }
    .bg-deco-2 { width: 300px; height: 300px; bottom: -80px; right: -60px; animation-delay: -3s; }
    @keyframes floatSlow {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(25px) rotate(10deg); }
    }

    .game-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 580px;
      background: var(--card-bg);
      border-radius: 32px;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(230, 90, 100, 0.12), 0 4px 12px rgba(0,0,0,0.04);
      border: 4px solid #FFF0E8;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }
    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .title-group h1 {
      font-size: 26px;
      color: #D63031;
      text-shadow: 1px 2px 0px #FFD2D2;
      letter-spacing: 0.5px;
    }
    .badge-rule {
      background: #FFEAA7;
      color: #D35400;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: bold;
    }

    /* Top Stats Bar */
    .stats-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 12px;
    }
    .stat-card {
      background: #FFF5F2;
      border-radius: 18px;
      padding: 10px 14px;
      text-align: center;
      border: 2px solid #FFE4DB;
      position: relative;
      overflow: hidden;
    }
    .stat-label {
      font-size: 13px;
      color: #A05C5C;
      margin-bottom: 2px;
    }
    .stat-value {
      font-size: 26px;
      font-weight: bold;
      color: #D63031;
      font-family: 'Nunito', 'Jua', sans-serif;
      line-height: 1.1;
    }
    .stat-card.timer .stat-value {
      color: #E67E22;
    }
    .stat-card.timer.urgent .stat-value {
      color: #D63031;
      animation: heartBeat 0.8s infinite;
    }
    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    /* Progress bar for time */
    .time-progress-wrap {
      width: 100%;
      height: 8px;
      background: #FFE8E0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: -6px;
    }
    .time-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #2ED573, #FFA502, #FF4757);
      width: 100%;
      border-radius: 999px;
      transition: width 0.3s linear;
    }

    /* Controls Bar */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .btn {
      font-family: 'Jua', sans-serif;
      font-size: 15px;
      padding: 9px 18px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      box-shadow: 0 4px 0 rgba(0,0,0,0.12);
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.12);
    }
    .btn-pause {
      background: #70A1FF;
      color: white;
    }
    .btn-pause:hover { background: #5352ED; }
    .btn-restart {
      background: #FFA502;
      color: white;
    }
    .btn-restart:hover { background: #FF7F50; }
    .btn-rank {
      background: #A55EEA;
      color: white;
      margin-left: auto;
    }
    .btn-rank:hover { background: #8854D0; }

    /* Game Board Canvas / Container */
    .board-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #FFFDF9;
      border-radius: 24px;
      border: 3px dashed var(--board-border);
      padding: 10px;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.03);
    }

    .apple-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 6px;
      width: 100%;
      height: 100%;
    }

    /* SVG Connecting Line Overlay */
    .connection-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .drag-line {
      stroke: #FF4757;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-dasharray: 8 4;
      animation: dashMove 1s linear infinite;
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -24; }
    }

    /* Individual Apple Item */
    .apple-item {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 14px;
      background: transparent;
      touch-action: none;
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .apple-item:hover:not(.cleared) {
      transform: scale(1.08);
      z-index: 2;
    }
    .apple-item.cleared {
      pointer-events: none;
      visibility: hidden;
    }

    /* SVG Apple Graphic */
    .apple-art {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      filter: drop-shadow(0 3px 2px rgba(214, 48, 49, 0.2));
      transition: all 0.2s ease;
    }
    .apple-item.selected .apple-art {
      transform: scale(1.15) rotate(-3deg);
      filter: drop-shadow(0 0 10px #FF4757);
      animation: pulseGlow 0.8s infinite alternate;
    }
    @keyframes pulseGlow {
      from { filter: drop-shadow(0 0 6px #FF4757); }
      to { filter: drop-shadow(0 0 14px #FF6B81); }
    }

    /* Apple SVG internal elements */
    .apple-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .logo-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .jawoon-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
      box-shadow: 0 3px 8px rgba(138, 28, 86, 0.22);
      transition: transform 0.2s ease;
    }
    .apple-item.selected .jawoon-img {
      box-shadow: 0 0 14px #8B1E5A, 0 0 22px #D980FA;
    }
    .apple-number {
      position: absolute;
      font-family: 'Nunito', 'Jua', sans-serif;
      font-size: 19px;
      font-weight: 900;
      color: #FFFFFF;
      background: rgba(139, 30, 90, 0.90);
      border: 2px solid #FFFFFF;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.45);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Mismatch Shake Animation */
    .apple-item.shake {
      animation: shakeItem 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
    }
    @keyframes shakeItem {
      10%, 90% { transform: translate3d(-3px, 0, 0) scale(1.05); }
      20%, 80% { transform: translate3d(4px, 0, 0) scale(1.05); }
      30%, 50%, 70% { transform: translate3d(-4px, 0, 0) scale(1.05); }
      40%, 60% { transform: translate3d(4px, 0, 0) scale(1.05); }
    }

    /* Pop/Match Animation */
    .apple-item.popping {
      animation: applePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      z-index: 20;
    }
    @keyframes applePop {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35) rotate(15deg); opacity: 0.9; }
      100% { transform: scale(0.1) rotate(-20deg); opacity: 0; }
    }

    /* Particle Burst */
    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      z-index: 15;
      animation: particleFly 0.6s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }
    @keyframes particleFly {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* Floating Score Popup */
    .score-popup {
      position: absolute;
      color: #FF4757;
      font-family: 'Jua', sans-serif;
      font-size: 20px;
      font-weight: bold;
      pointer-events: none;
      z-index: 25;
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.9);
      animation: floatUp 0.7s ease-out forwards;
    }
    @keyframes floatUp {
      0% { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
      30% { transform: translate(-50%, -15px) scale(1.2); opacity: 1; }
      100% { transform: translate(-50%, -35px) scale(1); opacity: 0; }
    }

    /* Overlays (Pause, Game Over, Ranking) */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      padding: 24px;
      text-align: center;
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-box {
      background: white;
      border-radius: 24px;
      padding: 24px 28px;
      box-shadow: 0 16px 36px rgba(214, 48, 49, 0.18);
      border: 3px solid #FFE4DB;
      width: 100%;
      max-width: 400px;
      animation: popIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes popIn {
      from { transform: scale(0.85); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-title {
      font-size: 26px;
      color: #D63031;
      margin-bottom: 12px;
    }

    /* Ranking List Table */
    .ranking-list {
      list-style: none;
      width: 100%;
      margin: 12px 0 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #FFF5F2;
      padding: 8px 14px;
      border-radius: 12px;
      font-size: 15px;
      border: 1px solid #FFE5DC;
    }
    .ranking-item.rank-1 { background: #FFF9E6; border-color: #FFEAA7; font-weight: bold; }
    .ranking-item.rank-2 { background: #F8F9FA; border-color: #DFE4EA; }
    .ranking-item.rank-3 { background: #FFF1E6; border-color: #F8D7C4; }
    .rank-num {
      width: 28px;
      text-align: left;
      font-size: 16px;
    }
    .rank-name {
      flex: 1;
      text-align: left;
      margin-left: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .rank-score {
      font-family: 'Nunito', sans-serif;
      font-weight: 900;
      color: #D63031;
      font-size: 17px;
    }

    .input-name {
      width: 100%;
      padding: 10px 14px;
      font-size: 16px;
      font-family: 'Jua', sans-serif;
      border: 2px solid #FFCCD2;
      border-radius: 12px;
      outline: none;
      margin: 10px 0;
      text-align: center;
      transition: border-color 0.2s;
    }
    .input-name:focus {
      border-color: #FF4757;
    }

    .btn-large {
      font-size: 18px;
      padding: 12px 28px;
      border-radius: 16px;
      background: linear-gradient(135deg, #FF6B81, #FF4757);
      color: white;
      width: 100%;
      justify-content: center;
    }
    .btn-large:hover {
      background: linear-gradient(135deg, #FF4757, #D63031);
    }
    .btn-secondary {
      background: #A4B0BE;
      color: white;
      font-size: 15px;
      padding: 8px 16px;
      border-radius: 12px;
      margin-top: 8px;
      width: 100%;
      justify-content: center;
    }

    .footer-hint {
      text-align: center;
      font-size: 13px;
      color: #B2BEC3;
    }

    /* Responsive adjustments */
    @media (max-width: 480px) {
      .game-container {
        padding: 14px;
        border-radius: 24px;
        gap: 12px;
      }
      .title-group h1 { font-size: 20px; }
      .badge-rule { font-size: 11px; padding: 2px 8px; }
      .stat-card { padding: 6px 8px; border-radius: 14px; }
      .stat-value { font-size: 20px; }
      .btn { font-size: 13px; padding: 7px 12px; }
      .apple-grid { gap: 4px; }
      .apple-number { font-size: 16px; }
    }
  </style>
</head>

    function createAppleSVG() {
      return `
        <div class="logo-wrapper">
          <img src="${JAWOON_LOGO_SRC}" class="jawoon-img" alt="자운고 마크" draggable="false" />
        </div>
      `;
    }

    // 상태 관리
    let board = []; // { id, row, col, value, cleared }
    let selectedFirst = null;
    let isDragging = false;
    let dragStartEl = null;

    let score = 0;
    let clearedCount = 0;
    let timeLeft = GAME_DURATION;
    let timerInterval = null;
    let isPaused = false;
    let isGameOver = false;

    // DOM 요소
    const appleGridEl = document.getElementById('appleGrid');
    const boardWrapperEl = document.getElementById('boardWrapper');
    const connectionSvgEl = document.getElementById('connectionSvg');
    const dragLineEl = document.getElementById('dragLine');

    const scoreDisplay = document.getElementById('scoreDisplay');
    const timeDisplay = document.getElementById('timeDisplay');
    const timerCard = document.getElementById('timerCard');
    const remainDisplay = document.getElementById('remainDisplay');
    const timeProgress = document.getElementById('timeProgress');

    const btnPause = document.getElementById('btnPause');
    const pauseIcon = document.getElementById('pauseIcon');
    const pauseText = document.getElementById('pauseText');
    const btnRestart = document.getElementById('btnRestart');
    const btnRank = document.getElementById('btnRank');

    const pauseOverlay = document.getElementById('pauseOverlay');
    const btnResume = document.getElementById('btnResume');

    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const gameOverTitle = document.getElementById('gameOverTitle');
    const gameOverReason = document.getElementById('gameOverReason');
    const finalScoreDisplay = document.getElementById('finalScoreDisplay');
    const finalDetailDisplay = document.getElementById('finalDetailDisplay');
    const playerNameInput = document.getElementById('playerNameInput');
    const btnSaveScore = document.getElementById('btnSaveScore');
    const recordRankSection = document.getElementById('recordRankSection');
    const btnPlayAgain = document.getElementById('btnPlayAgain');

    const rankingOverlay = document.getElementById('rankingOverlay');
    const rankingList = document.getElementById('rankingList');
    const btnCloseRank = document.getElementById('btnCloseRank');
    const btnClearRank = document.getElementById('btnClearRank');

    /* =========================================================
     * 게임 초기화 & 맵 생성
     * ========================================================= */
    function generateBoardNumbers() {
      // 짝수 개수(64개)이므로 10의 짝(a, 10-a)을 기본 보장하도록 32쌍 생성 후 셔플
      const pairs = [];
      for (let i = 0; i < TOTAL_APPLES / 2; i++) {
        const valA = Math.floor(Math.random() * 9) + 1; // 1 ~ 9
        const valB = 10 - valA;
        pairs.push(valA, valB);
      }

      // Fisher-Yates 셔플
      for (let i = pairs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
      }

      return pairs;
    }

    function initGame() {
      // 상태 초기화
      clearInterval(timerInterval);
      score = 0;
      clearedCount = 0;
      timeLeft = GAME_DURATION;
      isPaused = false;
      isGameOver = false;
      selectedFirst = null;
      isDragging = false;
      dragStartEl = null;

      hideLine();
      closeAllOverlays();

      scoreDisplay.textContent = score;
      remainDisplay.textContent = TOTAL_APPLES;
      timeDisplay.textContent = `${timeLeft}s`;
      timeProgress.style.width = '100%';
      timerCard.classList.remove('urgent');
      setPauseButtonState(false);

      const numbers = generateBoardNumbers();
      board = [];
      appleGridEl.innerHTML = '';

      for (let idx = 0; idx < TOTAL_APPLES; idx++) {
        const row = Math.floor(idx / GRID_SIZE);
        const col = idx % GRID_SIZE;
        const value = numbers[idx];

        const item = {
          id: idx,
          row,
          col,
          value,
          cleared: false
        };
        board.push(item);

        const el = document.createElement('div');
        el.className = 'apple-item';
        el.dataset.id = idx;
        el.innerHTML = `
          <div class="apple-art">
            ${createAppleSVG()}
            <span class="apple-number">${value}</span>
          </div>
        `;

        attachAppleEvents(el);
        appleGridEl.appendChild(el);
      }

      startTimer();
    }

    /* =========================================================
     * 타이머 & 일시정지 관리
     * ========================================================= */
    function startTimer() {
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (isPaused || isGameOver) return;

        timeLeft--;
        if (timeLeft <= 0) {
          timeLeft = 0;
          updateTimerUI();
          endGame('time_out');
          return;
        }

        updateTimerUI();
      }, 1000);
    }

    function updateTimerUI() {
      timeDisplay.textContent = `${timeLeft}s`;
      const ratio = Math.max(0, (timeLeft / GAME_DURATION) * 100);
      timeProgress.style.width = `${ratio}%`;

      if (timeLeft <= 15) {
        timerCard.classList.add('urgent');
      } else {
        timerCard.classList.remove('urgent');
      }
    }

    function togglePause() {
      if (isGameOver) return;
      isPaused = !isPaused;
      setPauseButtonState(isPaused);

      if (isPaused) {
        pauseOverlay.classList.add('active');
        clearSelection();
        hideLine();
      } else {
        pauseOverlay.classList.remove('active');
      }
    }

    function setPauseButtonState(paused) {
      if (paused) {
        pauseIcon.textContent = '▶️';
        pauseText.textContent = '이어하기';
        btnPause.style.background = '#2ED573';
      } else {
        pauseIcon.textContent = '⏸️';
        pauseText.textContent = '일시정지';
        btnPause.style.background = '#70A1FF';
      }
    }

    /* =========================================================
     * 터치 & 마우스 상호작용 (클릭 및 드래그 지원)
     * ========================================================= */
    function attachAppleEvents(element) {
      // 마우스 다운 / 터치 스타트
      element.addEventListener('pointerdown', (e) => {
        if (isPaused || isGameOver) return;
        const id = parseInt(element.dataset.id, 10);
        if (board[id].cleared) return;

        isDragging = true;
        dragStartEl = element;
        element.setPointerCapture(e.pointerId);

        // 첫 번째 선택이 없는 경우 클릭 또는 드래그 시작점으로 설정
        if (!selectedFirst) {
          selectApple(id);
          startLineAtElement(element);
        } else if (selectedFirst.id === id) {
          // 이미 선택된 것을 다시 누르면 취소
          clearSelection();
          hideLine();
        } else {
          // 이미 첫 번째가 선택되어 있을 때 두 번째 사과 클릭
          tryMatch(selectedFirst.id, id);
        }
      });

      element.addEventListener('pointermove', (e) => {
        if (!isDragging || !dragStartEl || isPaused || isGameOver) return;
        const rect = boardWrapperEl.getBoundingClientRect();
        const curX = e.clientX - rect.left;
        const curY = e.clientY - rect.top;

        updateLineEnd(curX, curY);

        // 현재 마우스 아래의 요소 감지
        const targetUnder = document.elementFromPoint(e.clientX, e.clientY);
        const appleUnder = targetUnder ? targetUnder.closest('.apple-item') : null;
        if (appleUnder && appleUnder !== dragStartEl) {
          const underId = parseInt(appleUnder.dataset.id, 10);
          if (!board[underId].cleared && selectedFirst && selectedFirst.id !== underId) {
            // 다른 사과 위로 드래그 도달 시 바로 매칭 시도
            tryMatch(selectedFirst.id, underId);
            isDragging = false;
            hideLine();
          }
        }
      });

      element.addEventListener('pointerup', (e) => {
        if (isDragging) {
          isDragging = false;
          hideLine();
        }
      });

      element.addEventListener('pointercancel', () => {
        isDragging = false;
        hideLine();
      });
    }

    function selectApple(id) {
      clearSelection();
      selectedFirst = board[id];
      const el = getAppleElement(id);
      if (el) el.classList.add('selected');
    }

    function clearSelection() {
      if (selectedFirst) {
        const el = getAppleElement(selectedFirst.id);
        if (el) el.classList.remove('selected');
      }
      selectedFirst = null;
    }

    function getAppleElement(id) {
      return appleGridEl.querySelector(`.apple-item[data-id="${id}"]`);
    }

    // 선 그리기 도우미
    function getCenterCoords(el) {
      const rect = el.getBoundingClientRect();
      const wrapRect = boardWrapperEl.getBoundingClientRect();
      return {
        x: rect.left + rect.width / 2 - wrapRect.left,
        y: rect.top + rect.height / 2 - wrapRect.top
      };
    }

    function startLineAtElement(el) {
      const center = getCenterCoords(el);
      dragLineEl.setAttribute('x1', center.x);
      dragLineEl.setAttribute('y1', center.y);
      dragLineEl.setAttribute('x2', center.x);
      dragLineEl.setAttribute('y2', center.y);
      dragLineEl.style.display = 'block';
    }

    function updateLineEnd(x, y) {
      dragLineEl.setAttribute('x2', x);
      dragLineEl.setAttribute('y2', y);
    }

    function hideLine() {
      dragLineEl.style.display = 'none';
    }

    /* =========================================================
     * 매칭 검증 & 시각적 피드백
     * ========================================================= */
    function tryMatch(idA, idB) {
      const itemA = board[idA];
      const itemB = board[idB];
      if (!itemA || !itemB || itemA.cleared || itemB.cleared) {
        clearSelection();
        return;
      }

      const sum = itemA.value + itemB.value;
      const elA = getAppleElement(idA);
      const elB = getAppleElement(idB);

      if (sum === 10) {
        // 성공 매칭!
        handleMatchSuccess(itemA, itemB, elA, elB);
      } else {
        // 실패 (10이 아님)
        handleMatchFail(elA, elB);
      }

      clearSelection();
      hideLine();
    }

    function handleMatchSuccess(itemA, itemB, elA, elB) {
      itemA.cleared = true;
      itemB.cleared = true;
      clearedCount += 2;

      // 점수 계산: 1쌍당 100점 기본 + 남은 시간에 따른 보너스 약간
      const matchScore = 100 + Math.floor(timeLeft / 2);
      score += matchScore;
      scoreDisplay.textContent = score;

      const remaining = TOTAL_APPLES - clearedCount;
      remainDisplay.textContent = remaining;

      // 파티클 & 팝 애니메이션
      triggerPopEffect(elA);
      triggerPopEffect(elB);
      showFloatingScore(elA, `+${matchScore}`);
      showFloatingScore(elB, '짝 완성! ✨');

      // 모든 사과 클리어 확인
      if (clearedCount >= TOTAL_APPLES) {
        setTimeout(() => {
          endGame('all_cleared');
        }, 500);
      }
    }

    function handleMatchFail(elA, elB) {
      [elA, elB].forEach(el => {
        if (!el) return;
        el.classList.remove('shake');
        // 트리거 리플로우
        void el.offsetWidth;
        el.classList.add('shake');
        setTimeout(() => el.classList.remove('shake'), 450);
      });
    }

    function triggerPopEffect(element) {
      if (!element) return;
      element.classList.add('popping');

      // 파티클 방출
      const rect = element.getBoundingClientRect();
      const wrapRect = boardWrapperEl.getBoundingClientRect();
      const originX = rect.left + rect.width / 2 - wrapRect.left;
      const originY = rect.top + rect.height / 2 - wrapRect.top;

      const colors = ['#8B1E5A', '#B53471', '#FDA7DF', '#D980FA', '#FFA502', '#FFFFFF'];
      for (let i = 0; i < 9; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        const angle = Math.random() * Math.PI * 2;
        const dist = 30 + Math.random() * 45;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;
        const size = 6 + Math.random() * 8;
        const color = colors[Math.floor(Math.random() * colors.length)];

        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.backgroundColor = color;
        particle.style.left = `${originX}px`;
        particle.style.top = `${originY}px`;
        particle.style.setProperty('--tx', `${tx}px`);
        particle.style.setProperty('--ty', `${ty}px`);

        boardWrapperEl.appendChild(particle);
        setTimeout(() => particle.remove(), 600);
      }

      setTimeout(() => {
        element.classList.remove('popping');
        element.classList.add('cleared');
      }, 380);
    }

    function showFloatingScore(element, text) {
      if (!element) return;
      const rect = element.getBoundingClientRect();
      const wrapRect = boardWrapperEl.getBoundingClientRect();
      const x = rect.left + rect.width / 2 - wrapRect.left;
      const y = rect.top - wrapRect.top;

      const popup = document.createElement('div');
      popup.className = 'score-popup';
      popup.textContent = text;
      popup.style.left = `${x}px`;
      popup.style.top = `${y}px`;

      boardWrapperEl.appendChild(popup);
      setTimeout(() => popup.remove(), 700);
    }

    /* =========================================================
     * 게임 오버 및 랭킹 관리 (localStorage)
     * ========================================================= */
    function endGame(reason) {
      isGameOver = true;
      clearInterval(timerInterval);
      clearSelection();
      hideLine();

      if (reason === 'all_cleared') {
        // 남은 시간 보너스
        const timeBonus = timeLeft * 20;
        score += timeBonus;
        scoreDisplay.textContent = score;

        gameOverEmoji.textContent = '🏆';
        gameOverTitle.textContent = '대성공! 올 클리어!';
        gameOverReason.textContent = `모든 자운고 마크를 다 제거했습니다! (남은 시간 보너스 +${timeBonus}점)`;
      } else {
        gameOverEmoji.textContent = '⏰';
        gameOverTitle.textContent = '시간 종료!';
        gameOverReason.textContent = '제한 시간 90초가 모두 지났습니다.';
      }

      finalScoreDisplay.textContent = `${score.toLocaleString()}점`;
      finalDetailDisplay.textContent = `제거한 마크: ${clearedCount}개 / 64개`;

      playerNameInput.value = '';
      recordRankSection.style.display = 'block';
      gameOverOverlay.classList.add('active');
    }

    function getRankings() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveRanking(name, finalScore) {
      const list = getRankings();
      const newEntry = {
        name: name.trim() || '이름없음',
        score: finalScore,
        date: new Date().toLocaleDateString('ko-KR', { month: 'short', day: 'numeric' })
      };
      list.push(newEntry);
      // 점수 내림차순 정렬 후 Top 10만 유지
      list.sort((a, b) => b.score - a.score);
      const top10 = list.slice(0, 10);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(top10));
      return top10;
    }

    function renderRankings() {
      const list = getRankings();
      rankingList.innerHTML = '';

      if (list.length === 0) {
        rankingList.innerHTML = `<li style="text-align: center; color: #999; padding: 20px;">아직 등록된 랭킹 기록이 없습니다.<br>첫 번째 주인공이 되어보세요! 🍎</li>`;
        return;
      }

      list.forEach((item, index) => {
        const li = document.createElement('li');
        let rankClass = '';
        let medal = `${index + 1}`;
        if (index === 0) { rankClass = 'rank-1'; medal = '🥇'; }
        else if (index === 1) { rankClass = 'rank-2'; medal = '🥈'; }
        else if (index === 2) { rankClass = 'rank-3'; medal = '🥉'; }

        li.className = `ranking-item ${rankClass}`;
        li.innerHTML = `
          <span class="rank-num">${medal}</span>
          <span class="rank-name">${escapeHtml(item.name)} <span style="font-size: 11px; color:#aaa;">(${item.date || ''})</span></span>
          <span class="rank-score">${item.score.toLocaleString()}점</span>
        `;
        rankingList.appendChild(li);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    function closeAllOverlays() {
      pauseOverlay.classList.remove('active');
      gameOverOverlay.classList.remove('active');
      rankingOverlay.classList.remove('active');
    }

    /* =========================================================
     * 이벤트 바인딩
     * ========================================================= */
    btnPause.addEventListener('click', togglePause);
    btnResume.addEventListener('click', togglePause);

    btnRestart.addEventListener('click', () => {
      if (confirm('게임을 새로 시작하시겠습니까?')) {
        initGame();
      }
    });

    btnPlayAgain.addEventListener('click', () => {
      initGame();
    });

    btnRank.addEventListener('click', () => {
      renderRankings();
      rankingOverlay.classList.add('active');
    });

    btnCloseRank.addEventListener('click', () => {
      rankingOverlay.classList.remove('active');
    });

    btnClearRank.addEventListener('click', () => {
      if (confirm('랭킹 기록을 모두 초기화하시겠습니까?')) {
        localStorage.removeItem(STORAGE_KEY);
        renderRankings();
      }
    });

    btnSaveScore.addEventListener('click', () => {
      const name = playerNameInput.value.trim();
      if (!name) {
        alert('이름이나 닉네임을 입력해주세요!');
        playerNameInput.focus();
        return;
      }
      saveRanking(name, score);
      recordRankSection.style.display = 'none';
      renderRankings();
      gameOverOverlay.classList.remove('active');
      rankingOverlay.classList.add('active');
    });

    playerNameInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        btnSaveScore.click();
      }
    });

    // 시작
    initGame();
  </script>
</body>
</html>
